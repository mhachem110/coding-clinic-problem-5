name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Bash syntax
        run: bash -n ebs-snapshot-backup.sh tests/test-backup.sh
      - name: ShellCheck
        run: shellcheck ebs-snapshot-backup.sh tests/test-backup.sh
      - name: Mocked AWS tests
        run: bash tests/test-backup.sh
